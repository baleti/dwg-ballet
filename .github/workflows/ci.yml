name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: python -m pip install -r packaging/requirements-app.txt pytest
      # tests/ use synthetic data only; corpus-dependent tests skip themselves when no corpus is present
      - run: python -m pytest -q tests --ignore=tests/browser
  installer-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: choco install innosetup -y --no-progress
      - run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with: {name: dwg-ballet-setup, path: dist/dwg-ballet-setup-*.exe}
  app-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sh packaging/macos/build_macos.sh
      - uses: actions/upload-artifact@v4
        with: {name: dwg-ballet-macos, path: dist/dwg-ballet.dmg}
